name: Verify standalone Wordplai

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  components:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:widget:state
      - name: Word component and transport checks (no Office process)
        shell: pwsh
        run: ./modules/word/test.ps1 -OutputDirectory artifacts/ci-components
      - name: Retain synthetic native UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-${{ github.run_id }}
          path: artifacts/ci-components/ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: For-AI structure and safety
        shell: pwsh
        run: ./for-ai/scripts/check-context.ps1 -ProjectRoot .
